<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316"/>
      <stop offset="100%" style="stop-color:#EA580C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D"/>
      <stop offset="100%" style="stop-color:#F59E0B"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <circle cx="50" cy="50" r="48" fill="url(#grad)"/>
  <circle cx="50" cy="50" r="40" fill="#FEF3C7"/>
  
  <!-- Chef Hat -->
  <ellipse cx="50" cy="58" rx="25" ry="6" fill="url(#gold)"/>
  <path d="M25 58 Q25 35 40 28 Q50 22 60 28 Q75 35 75 58 Z" fill="url(#grad)"/>
  <ellipse cx="50" cy="30" rx="20" ry="12" fill="#FFF"/>
  <ellipse cx="40" cy="32" rx="10" ry="8" fill="#FFF"/>
  <ellipse cx="60" cy="32" rx="10" ry="8" fill="#FFF"/>
  
  <!-- KFM Text -->
  <text x="50" y="82" text-anchor="middle" font-family="Arial Black" font-size="14" font-weight="900" fill="url(#grad)">KFM</text>
  
  <!-- Border -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="url(#gold)" stroke-width="2"/>
</svg>
