<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Main Gradient - Warm African Colors -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316"/>
      <stop offset="50%" style="stop-color:#EA580C"/>
      <stop offset="100%" style="stop-color:#C2410C"/>
    </linearGradient>
    
    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D"/>
      <stop offset="50%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#D97706"/>
    </linearGradient>
    
    <!-- Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    
    <!-- Inner Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="200" cy="200" r="190" fill="url(#mainGradient)" filter="url(#shadow)"/>
  
  <!-- Inner Decorative Ring -->
  <circle cx="200" cy="200" r="175" fill="none" stroke="#FEF3C7" stroke-width="3" stroke-dasharray="20,10" opacity="0.5"/>
  
  <!-- White Inner Circle -->
  <circle cx="200" cy="200" r="160" fill="#FEF3C7"/>
  
  <!-- African Pattern - Top -->
  <g opacity="0.3">
    <path d="M140 60 L150 45 L160 60 L170 45 L180 60 L190 45 L200 60 L210 45 L220 60 L230 45 L240 60 L250 45 L260 60" 
          stroke="#EA580C" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Chef Hat - Modern Stylized -->
  <g filter="url(#glow)">
    <!-- Hat Base -->
    <ellipse cx="200" cy="190" rx="70" ry="15" fill="url(#goldGradient)"/>
    
    <!-- Hat Body -->
    <path d="M130 190 
             Q130 130 160 110 
             Q180 95 200 95 
             Q220 95 240 110 
             Q270 130 270 190 Z" 
          fill="url(#mainGradient)"/>
    
    <!-- Hat Top - Puffy Style -->
    <ellipse cx="200" cy="110" rx="55" ry="35" fill="#FFFFFF"/>
    <ellipse cx="175" cy="115" rx="25" ry="20" fill="#FFFFFF"/>
    <ellipse cx="225" cy="115" rx="25" ry="20" fill="#FFFFFF"/>
    
    <!-- Hat Shine -->
    <ellipse cx="200" cy="100" rx="30" ry="15" fill="#FEF3C7" opacity="0.6"/>
  </g>
  
  <!-- Decorative African Elements -->
  <g opacity="0.8">
    <!-- Left Tribal Mark -->
    <path d="M95 200 L105 185 L115 200 L105 215 Z" fill="url(#goldGradient)"/>
    <circle cx="105" cy="200" r="8" fill="#FEF3C7"/>
    
    <!-- Right Tribal Mark -->
    <path d="M305 200 L295 185 L285 200 L295 215 Z" fill="url(#goldGradient)"/>
    <circle cx="295" cy="200" r="8" fill="#FEF3C7"/>
  </g>
  
  <!-- Decorative Lines - African Inspiration -->
  <g stroke="#EA580C" stroke-width="2" fill="none" opacity="0.4">
    <path d="M120 250 Q150 260 200 260 Q250 260 280 250"/>
    <path d="M130 265 Q160 275 200 275 Q240 275 270 265"/>
    <path d="M140 280 Q170 290 200 290 Q230 290 260 280"/>
  </g>
  
  <!-- KFM Text - Modern Typography -->
  <text x="200" y="310" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="48" font-weight="900" fill="url(#mainGradient)" letter-spacing="8">
    KFM
  </text>
  
  <!-- DELICE Text - Elegant -->
  <text x="200" y="345" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#92400E" letter-spacing="12">
    DELICE
  </text>
  
  <!-- Decorative Dots -->
  <circle cx="130" cy="327" r="3" fill="#F97316"/>
  <circle cx="270" cy="327" r="3" fill="#F97316"/>
  
  <!-- Small Flame/Cooking Element -->
  <g transform="translate(200, 220)">
    <path d="M0 -15 Q10 -5 5 5 Q0 0 -5 5 Q-10 -5 0 -15" fill="#F97316" opacity="0.6"/>
  </g>
  
  <!-- Outer Decorative Ring -->
  <circle cx="200" cy="200" r="190" fill="none" stroke="url(#goldGradient)" stroke-width="4"/>
  
  <!-- Corner Accents -->
  <g fill="url(#goldGradient)">
    <circle cx="60" cy="60" r="6"/>
    <circle cx="340" cy="60" r="6"/>
    <circle cx="60" cy="340" r="6"/>
    <circle cx="340" cy="340" r="6"/>
  </g>
</svg>
