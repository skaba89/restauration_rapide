# Render Configuration for KFM DELICE
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: kfm-delice
    env: node
    region: oregon # or frankfurt for Europe
    plan: free # or starter, standard, pro
    branch: main
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: bash scripts/start-render.sh
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kfm-delice-db
          property: connectionString
      - key: NEXT_PUBLIC_APP_NAME
        value: KFM DELICE
      - key: NEXT_PUBLIC_APP_URL
        value: https://kfm-delice.onrender.com

databases:
  - name: kfm-delice-db
    databaseName: kfm_delice
    user: kfm_delice_user
    plan: free # PostgreSQL free tier
